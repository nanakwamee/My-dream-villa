<!DOCTYPE html>
<html>
<head>
  <title>My Dream Villa</title>
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
</head>
<body>
<a-scene shadow="type: pcfsoft">

  <!-- ================= CAMERAS ================= -->
  <!-- Front camera in front of house -->
  <a-entity id="walkCamera" camera position="0 1.6 -40" rotation="0 0 0" wasd-controls look-controls></a-entity>
  <a-entity id="topCamera" camera position="0 50 0" rotation="-90 0 0" visible="false"></a-entity>

  <!-- Camera toggle -->
  <a-entity>
    <script>
      document.addEventListener('keydown', function(event){
        const walkCam = document.querySelector('#walkCamera');
        const topCam = document.querySelector('#topCamera');
        if(event.key==='1'){
          walkCam.setAttribute('camera','active',true); topCam.setAttribute('camera','active',false);
          walkCam.setAttribute('visible',true); topCam.setAttribute('visible',false);
        }
        if(event.key==='2'){
          walkCam.setAttribute('camera','active',false); topCam.setAttribute('camera','active',true);
          walkCam.setAttribute('visible',false); topCam.setAttribute('visible',true);
        }
      });
    </script>
  </a-entity>

  <!-- ================= SKY & LIGHTING ================= -->
  <a-sky color="#87CEEB"></a-sky>
  <a-entity light="type: ambient; intensity: 0.4; color: #ffffff"></a-entity>
  <a-entity light="type: directional; intensity: 0.5; color: #ffffff" position="10 20 10"></a-entity>

  <!-- ================= GROUND ================= -->
  <a-plane rotation="-90 0 0" width="100" height="100" color="#7CFC00" shadow></a-plane>

  <!-- ================= HOUSE FLOOR ================= -->
  <a-box position="0 0 0" width="30" height="0.2" depth="20" color="#C19A6B" shadow></a-box>

  <!-- ================= HOUSE WALLS ================= -->
  <a-box position="0 3 -10" width="30" height="6" depth="0.2" color="#EEE5D0" shadow></a-box>
  <a-box position="0 3 10" width="30" height="6" depth="0.2" color="#EEE5D0" shadow></a-box>
  <a-box position="-15 3 0" width="0.2" height="6" depth="20" color="#EEE5D0" shadow></a-box>
  <a-box position="15 3 0" width="0.2" height="6" depth="20" color="#EEE5D0" shadow></a-box>

  <!-- Interior partitions -->
  <a-box position="0 3 0" width="0.2" height="6" depth="20" color="#D8C0A0" shadow></a-box> 
  <a-box position="7.5 3 -5" width="15" height="6" depth="0.2" color="#D8C0A0" shadow></a-box>

  <!-- ================= ROOF ================= -->
  <a-box position="-7.5 7 0" width="31" height="0.3" depth="22" color="#8B4513" rotation="0 0 30"></a-box>
  <a-box position="7.5 7 0" width="31" height="0.3" depth="22" color="#8B4513" rotation="0 0 -30"></a-box>

  <!-- ================= DOOR ================= -->
  <a-box position="0 1 -10.1" width="3" height="4" depth="0.1" color="#654321" shadow></a-box>

  <!-- ================= WINDOWS + CURTAINS ================= -->
  <a-box position="-12 3 -7" width="0.1" height="3" depth="5" color="#ADD8E6" opacity="0.4" shadow></a-box>
  <a-plane position="-11.95 3 -7" width="0.05" height="3" depth="5" color="#CD5C5C" opacity="0.6"
           animation="property: position.x; dir: alternate; dur: 2500; loop: true; to: -12"></a-plane>
  <a-box position="0 3 8" width="6" height="3" depth="0.1" color="#ADD8E6" opacity="0.4" shadow></a-box>
  <a-plane position="0 3 8.05" width="6" height="3" depth="0.05" color="#CD5C5C" opacity="0.6"
           animation="property: position.z; dir: alternate; dur: 2500; loop: true; to: 8"></a-plane>

  <!-- ================= SWIMMING POOL ================= -->
  <a-box position="0 0.1 -25" width="12" height="0.2" depth="6" color="#1E90FF" opacity="0.8" shadow
         animation="property: position.y; dir: alternate; dur: 2000; loop: true; to:0.15"></a-box>
  <a-text value="Swimming Pool" color="#000" align="center" position="0 3 -25" width="6"></a-text>
<!-- ================= LIVING ROOM ================= -->
  <a-box position="-7 1 -7" width="8" height="2" depth="6" color="#C49E7A" shadow></a-box>
  <a-text value="Living Room" color="#000" align="center" position="-7 4 -7" width="6"></a-text>
  <a-box position="-8 0.5 -6.5" width="3" height="0.6" depth="1.5" color="#8B4513" shadow></a-box>
  <a-box position="-6 0.5 -6.5" width="1.5" height="0.6" depth="1.5" color="#8B4513" shadow></a-box>
  <a-box position="-7 0.4 -5.5" width="2" height="0.2" depth="1" color="#654321" shadow></a-box>
  <a-box position="-5.5 1 -7" width="0.1" height="1.5" depth="2" color="#000000" shadow></a-box>
  <a-sphere position="-7 3.5 -7" radius="0.2" color="#FFFFE0" light="type: point; intensity:0.8;"></a-sphere>
  <a-cylinder position="-7 3.3 -7" radius="0.05" height="0.1" color="#555"
              animation="property: rotation; to: 0 360 0; loop: true; dur: 3000;"></a-cylinder>

  <!-- ================= KITCHEN ================= -->
  <a-box position="8 1 -7" width="6" height="2" depth="6" color="#DEB887" shadow></a-box>
  <a-text value="Kitchen" color="#000" align="center" position="8 4 -7" width="6"></a-text>
  <a-box position="7 0.5 -6" width="2" height="1" depth="2" color="#A9A9A9" shadow></a-box>
  <a-box position="9 0.5 -6" width="1" height="1" depth="1" color="#FF6347" shadow></a-box>
  <a-box position="9 0.5 -8" width="1" height="1" depth="1" color="#FF6347" shadow></a-box>
  <a-box position="8 1 -8.5" width="2" height="1" depth="0.5" color="#B22222" shadow></a-box>
  <a-sphere position="8 3.5 -7" radius="0.2" color="#FFFFE0" light="type: point; intensity:0.8"></a-sphere>

  <!-- ================= BEDROOM ================= -->
  <a-box position="0 1 5" width="10" height="2" depth="6" color="#D8C0A0" shadow></a-box>
  <a-text value="Bedroom" color="#000" align="center" position="0 5 5" width="6"></a-text>
  <a-box position="-2 0.5 5" width="6" height="0.6" depth="3" color="#FF69B4" shadow></a-box>
  <a-box position="-2 1.1 3.8" width="0.5" height="0.6" depth="0.5" color="#8B4513" shadow></a-box>
  <a-box position="2 1.1 3.8" width="0.5" height="0.6" depth="0.5" color="#8B4513" shadow></a-box>
  <a-sphere position="0 3.5 5" radius="0.2" color="#FFFFE0" light="type: point; intensity:0.8"></a-sphere>
  <a-cylinder position="0 3.3 5" radius="0.05" height="0.1" color="#555"
              animation="property: rotation; to: 0 360 0; loop: true; dur: 3000;"></a-cylinder>

  <!-- ================= PLANTS ================= -->
  <a-cylinder position="15 0.5 -15" radius="0.3" height="1" color="#8B4513"></a-cylinder>
  <a-sphere position="15 1 -15" radius="0.6" color="#228B22"></a-sphere>
  <a-sphere position="15 1.5 -15" radius="0.5" color="#228B22"></a-sphere>
  <a-cylinder position="-15 0.5 -15" radius="0.3" height="1" color="#8B4513"></a-cylinder>
  <a-sphere position="-15 1 -15" radius="0.6" color="#228B22"></a-sphere>
  <a-sphere position="-15 1.5 -15" radius="0.5" color="#228B22"></a-sphere>

</a-scene>
</body>
</html>
